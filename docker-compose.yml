services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: mael
      POSTGRES_USER: mael
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - mael_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U mael -d mael"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  mael_pgdata:
